<style>
:root{--gold:#cdac76;--card:#1a1a1a;--chev:#333333;--chev-dark:#232323;--page:#0b0b0a}
*{box-sizing:border-box}
body{margin:0;background:var(--page);font-family:'Poppins',sans-serif;color:#f4ede1}
a{text-decoration:none;color:inherit}
.card{position:relative;width:min(100%,540px);min-height:100vh;margin:0 auto;background:var(--card);overflow:hidden;padding:28px 28px 56px}
.chev-outer{position:absolute;top:0;left:0;right:0;height:640px;background:var(--chev-dark);clip-path:polygon(0 0,100% 0,100% 20%,50% 100%,0 20%)}
.chev-inner{position:absolute;top:0;left:0;right:0;height:600px;background:var(--chev);clip-path:polygon(0 0,100% 0,100% 18%,50% 100%,0 18%)}
.stripes-l,.stripes-r{position:absolute;bottom:0;width:42%;height:260px;pointer-events:none}
.stripes-l{left:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,0.13) 0 2px,transparent 2px 16px);clip-path:polygon(0 0,100% 100%,0 100%)}
.stripes-r{right:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,0.13) 0 2px,transparent 2px 16px);clip-path:polygon(100% 0,100% 100%,0 100%)}
.content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);padding:8px 0;min-height:44px}
.avatar{width:clamp(120px,32vw,160px);height:clamp(120px,32vw,160px);border-radius:50%;border:4px solid var(--gold);overflow:hidden;background:#111;margin-top:clamp(40px,10vw,70px)}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block}
.cols{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,3vw,24px);margin-top:34px}
.col{display:flex;flex-direction:column;align-items:center;border-top:4px solid var(--gold);border-bottom:4px solid var(--gold);padding:0;color:var(--gold)}
.col .ico{height:clamp(120px,32vw,150px);display:flex;align-items:center;justify-content:center;width:100%}
.col .lbl{width:100%;text-align:center;border-top:4px solid var(--gold);padding:14px 0;font-size:clamp(11px,3vw,14px);font-weight:600;letter-spacing:0.18em;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px}
.col:hover{opacity:0.85}
.hint{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:44px;color:var(--gold);font-size:13px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;text-align:center;line-height:1.5}
.phone{display:inline-flex;align-items:center;gap:12px;margin-top:36px;font-size:16px;color:#e9e2d4;min-height:44px}
.phone .dot{width:34px;height:34px;border-radius:50%;background:#e9e2d4;display:flex;align-items:center;justify-content:center;color:#1a1a1a}
</style>
